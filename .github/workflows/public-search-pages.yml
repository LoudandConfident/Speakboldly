name: Refresh public search pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - novels-catalog.js
      - content/simplified-novels/**
      - novels/simplified/**
      - courses.js
      - material-library.js
      - google-sheets/clients/DriveFolders.gs
      - daily-idiom.js
      - home-gallery.js
      - daily-missions/**
      - index.html
      - styles.css
      - site-theme.css
      - public-seo-routes.js
      - public-tab-addresses.js
      - scripts/public-site-shell.mjs
      - content/bold-blog-public.json
      - scripts/build-motivation-previews.mjs
      - images/daily-motivation-*.png
      - scripts/build-public-pages.mjs
      - scripts/check-comment-service.mjs
      - scripts/check-public-seo-live.mjs
      - scripts/sync-public-blog.mjs
      - scripts/sync-public-reviews.mjs
      - scripts/build-search-assets.mjs
      - .github/workflows/public-search-pages.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: public-search-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sync only articles already published by the instructor
        run: node scripts/sync-public-blog.mjs
      - name: Refresh the public review snapshot without private fields
        run: node scripts/sync-public-reviews.mjs
      - name: Check public comment readiness without posting
        run: node scripts/check-comment-service.mjs
      - name: Install image tooling when picture derivatives need rebuilding
        run: |
          if node scripts/build-motivation-previews.mjs; then exit 0; fi
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick
          fi
      - run: npm run build:seo
      - run: node --test public-seo.test.mjs rewards-backend.test.mjs drive-folders.test.mjs material-program-cards.test.mjs general-english-exams.test.mjs general-english-speaking.test.mjs monthly-learning.test.mjs session-rounds.test.mjs report-tabs.test.mjs folder-passwords.test.mjs student-submissions.test.mjs coach-routing.test.mjs blog-comments.test.mjs blog-reading-tools.test.mjs blog-learning-backend.test.mjs simplified-novel.test.mjs motivation-copy-link.test.mjs motivation-author-text.test.mjs reviews-api.test.mjs motivation-email-compat.test.mjs
      - name: Save generated public pages and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          git add content/comment-service-status.json content/public-reviews.json programs learn assessments blog motivation reviews student-portal vision how-it-works contact join-us get-a-quote speak-hub images/motivation-preview images/daily-motivation-small-steps-teacher.png images/daily-motivation-math-teacher-board.png motivation-preview-images.js assets/site-base.min.css assets/site-theme.min.css sitemap.xml content/bold-blog-public.json content/public-pages-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public course, resource and published blog pages'
          git push
          gh api --method POST "repos/$GH_REPOSITORY/pages/builds" --silent
      - name: Verify live HTTPS pages and sitemap
        run: node scripts/check-public-seo-live.mjs
