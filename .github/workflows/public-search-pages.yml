name: Refresh public search pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - courses.js
      - daily-idiom.js
      - home-gallery.js
      - daily-missions/**
      - index.html
      - styles.css
      - site-theme.css
      - public-seo-routes.js
      - public-tab-addresses.js
      - scripts/public-site-shell.mjs
      - content/bold-blog-public.json
      - scripts/build-motivation-previews.mjs
      - images/daily-motivation-*.png
      - scripts/build-public-pages.mjs
      - scripts/check-public-seo-live.mjs
      - scripts/sync-public-blog.mjs
      - scripts/build-search-assets.mjs
      - .github/workflows/public-search-pages.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: public-search-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sync only articles already published by the instructor
        run: node scripts/sync-public-blog.mjs
      - run: npm run build:seo
      - run: node --test public-seo.test.mjs rewards-backend.test.mjs drive-folders.test.mjs material-program-cards.test.mjs general-english-exams.test.mjs
      - name: Save generated public pages and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          git add programs learn assessments blog motivation reviews student-portal vision how-it-works contact join-us get-a-quote images/motivation-preview motivation-preview-images.js assets/site-base.min.css assets/site-theme.min.css sitemap.xml content/bold-blog-public.json content/public-pages-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public course, resource and published blog pages'
          git push
          gh api --method POST "repos/$GH_REPOSITORY/pages/builds" --silent
      - name: Verify live HTTPS pages and sitemap
        run: node scripts/check-public-seo-live.mjs
